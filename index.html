<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIDDEN Hair Design 商品目錄</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
</head>
<body>
<header>
  <h1>HIDDEN Hair Design｜商品目錄</h1>
  <div class="tabs" id="tabs"></div>
</header>
<main>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none">目前沒有商品</div>
</main>

<script>
const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
let allProducts = [];
let activeCategory = "全部";

function fmtPrice(p){
  return "NT$" + Number(p).toLocaleString();
}

function imageUrl(path){
  if(!path) return null;
  const { data } = sb.storage.from("product-images").getPublicUrl(path);
  return data.publicUrl;
}

function render(){
  const cats = ["全部", ...Array.from(new Set(allProducts.map(p => p.category || "未分類")))];
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = cats.map(c =>
    `<button class="tab ${c===activeCategory?'active':''}" data-cat="${c}">${c}</button>`
  ).join("");
  tabsEl.querySelectorAll(".tab").forEach(btn=>{
    btn.onclick = ()=>{ activeCategory = btn.dataset.cat; render(); };
  });

  const list = activeCategory === "全部" ? allProducts : allProducts.filter(p => (p.category||"未分類") === activeCategory);
  const gridEl = document.getElementById("grid");
  const emptyEl = document.getElementById("empty");

  if(list.length === 0){
    gridEl.innerHTML = "";
    emptyEl.style.display = "block";
    return;
  }
  emptyEl.style.display = "none";

  gridEl.innerHTML = list.map(p=>{
    const url = imageUrl(p.image_path);
    const hasDiscount = p.discount_price != null && Number(p.discount_price) < Number(p.price);
    return `
      <div class="card">
        <div class="thumb">
          ${url ? `<img src="${url}" alt="${p.name}" loading="lazy">` : `<span class="ph">尚無圖片</span>`}
        </div>
        <div class="body">
          <div class="name">${p.name}</div>
          ${p.description ? `<div class="desc">${p.description}</div>` : ""}
          <div class="price-row">
            <span class="price">${fmtPrice(hasDiscount ? p.discount_price : p.price)}</span>
            ${hasDiscount ? `<span class="price original">${fmtPrice(p.price)}</span>` : ""}
          </div>
        </div>
      </div>`;
  }).join("");
}

async function load(){
  const { data, error } = await sb
    .from("products")
    .select("*")
    .eq("is_active", true)
    .order("sort_order", { ascending: true })
    .order("created_at", { ascending: false });
  if(error){
    document.getElementById("grid").innerHTML = "";
    document.getElementById("empty").style.display = "block";
    document.getElementById("empty").textContent = "讀取失敗，請稍後再試";
    console.error(error);
    return;
  }
  allProducts = data || [];
  render();
}

load();
</script>
</body>
</html>
